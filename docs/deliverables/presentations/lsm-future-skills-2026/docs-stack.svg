<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .lab { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
    .mono{ font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
  </style>

  <!-- Slides -->
  <rect x="10" y="6" width="300" height="100" rx="10" fill="#f6d6f2" stroke="#c25bb0" stroke-width="2.5"/>
  <text class="lab" x="30" y="42">Slides</text>
  <text class="mono" x="30" y="72" fill="#1a1a1a">the mean was <tspan fill="#2f8f4e" font-weight="700">4.2</tspan></text>
  <rect x="30" y="82" width="190" height="13" rx="3" fill="#e7c7e0"/>

  <!-- Manuscript -->
  <rect x="10" y="126" width="300" height="100" rx="10" fill="#f6d6f2" stroke="#c25bb0" stroke-width="2.5"/>
  <text class="lab" x="30" y="162">Manuscript</text>
  <text class="mono" x="30" y="192" fill="#1a1a1a">the mean was <tspan fill="#2f8f4e" font-weight="700">4.2</tspan></text>
  <rect x="30" y="202" width="190" height="13" rx="3" fill="#e7c7e0"/>

  <!-- Report -->
  <rect x="10" y="246" width="300" height="100" rx="10" fill="#f6d6f2" stroke="#c25bb0" stroke-width="2.5"/>
  <text class="lab" x="30" y="282">Report</text>
  <text class="mono" x="30" y="312" fill="#1a1a1a">the mean was <tspan fill="#2f8f4e" font-weight="700">4.2</tspan></text>
  <rect x="30" y="322" width="190" height="13" rx="3" fill="#e7c7e0"/>
</svg>
