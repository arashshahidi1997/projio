<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <!-- worktop -->
  <rect x="22" y="214" width="156" height="12" rx="4" fill="#b9c4d0" stroke="#94a1af" stroke-width="2"/>

  <!-- robot -->
  <line x1="70" y1="54" x2="70" y2="38" stroke="#6b7787" stroke-width="3"/>
  <circle cx="70" cy="34" r="5" fill="#e0483d"/>
  <rect x="38" y="54" width="72" height="58" rx="12" fill="#d3dbe6" stroke="#6b7787" stroke-width="3"/>
  <circle cx="60" cy="82" r="6.5" fill="#2f6fd0"/>
  <circle cx="90" cy="82" r="6.5" fill="#2f6fd0"/>
  <line x1="64" y1="99" x2="86" y2="99" stroke="#6b7787" stroke-width="3" stroke-linecap="round"/>
  <rect x="48" y="114" width="54" height="66" rx="10" fill="#c2cdda" stroke="#6b7787" stroke-width="3"/>

  <!-- one source document being assembled on the worktop -->
  <rect x="102" y="150" width="60" height="62" rx="4" fill="#e7ebf0" stroke="#c4ccd4" stroke-width="1.5"/>
  <rect x="98"  y="146" width="60" height="62" rx="4" fill="#f2f4f7" stroke="#c4ccd4" stroke-width="1.5"/>
  <rect x="94"  y="142" width="60" height="62" rx="4" fill="#ffffff"/>
  <rect x="94"  y="142" width="60" height="12" fill="#f6d6f2"/>
  <text x="124" y="151" text-anchor="middle" font-size="7.5" font-weight="700" fill="#7a3e6e" font-family="Helvetica Neue, Arial, sans-serif">source.qmd</text>
  <rect x="100" y="162" width="48" height="3.5" rx="1.5" fill="#d7dde3"/>
  <rect x="100" y="170" width="40" height="3.5" rx="1.5" fill="#d7dde3"/>
  <rect x="100" y="180" width="48" height="20" rx="2" fill="#eaf3fb" stroke="#3a86c8" stroke-width="1.2"/>
  <rect x="106" y="190" width="6" height="8"  fill="#3a86c8"/>
  <rect x="116" y="186" width="6" height="12" fill="#3a86c8"/>
  <rect x="126" y="192" width="6" height="6"  fill="#3a86c8"/>
  <rect x="136" y="188" width="6" height="10" fill="#3a86c8"/>
  <rect x="94"  y="142" width="60" height="62" rx="4" fill="none" stroke="#c25bb0" stroke-width="2"/>

  <!-- stamping arm (pivots at shoulder, bobs down to publish) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-6 104 126; 18 104 126; -6 104 126" keyTimes="0;0.4;1"
      dur="0.8s" repeatCount="indefinite"/>
    <rect x="99" y="122" width="12" height="62" rx="5" fill="#9aa8b8" stroke="#6b7787" stroke-width="1.5"/>
    <rect x="104" y="176" width="10" height="10" rx="2" fill="#6b7787"/>
    <rect x="92" y="184" width="34" height="12" rx="3" fill="#3b5b7a"/>
  </g>

  <!-- SPECS document fed into the robot's head -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 48 60" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.72;1" dur="2.4s" repeatCount="indefinite"/>
    <rect x="8" y="7" width="36" height="27" rx="3" fill="#ffffff" stroke="#6b7787" stroke-width="1.5"/>
    <line x1="14" y1="15" x2="38" y2="15" stroke="#c9ced3" stroke-width="1.4"/>
    <text x="26" y="29" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2f6fd0" font-family="Helvetica Neue, Arial, sans-serif">SPECS</text>
  </g>
</svg>
