<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="va" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a95a0"/>
    </marker>
    <marker id="vr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f8f4e"/>
    </marker>
  </defs>
  <style>
    .t   { font-size: 15px; text-anchor: middle; fill: #1a1a1a; }
    .sm  { font-size: 13px; text-anchor: middle; fill: #55606b; }
  </style>

  <!-- roll-back arc -->
  <path d="M846 150 C 846 40, 384 40, 384 150" fill="none" stroke="#2f8f4e" stroke-width="3" marker-end="url(#vr)"/>
  <text x="615" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="#2f8f4e">roll back a mistake</text>

  <!-- commit nodes -->
  <g id="nodes">
    <!-- template repeated 4× at x=150,383,616,849 -->
    <g>
      <rect x="90" y="120" width="120" height="90" rx="10" fill="#eef2f6" stroke="#3b5b7a" stroke-width="2"/>
      <rect x="108" y="140" width="34" height="44" rx="4" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <line x1="114" y1="152" x2="136" y2="152" stroke="#b9c4d0" stroke-width="2"/><line x1="114" y1="162" x2="136" y2="162" stroke="#b9c4d0" stroke-width="2"/><line x1="114" y1="172" x2="130" y2="172" stroke="#b9c4d0" stroke-width="2"/>
      <path d="M158 146 a16 6 0 0 0 32 0 v32 a16 6 0 0 1 -32 0 z" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <ellipse cx="174" cy="146" rx="16" ry="6" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <text class="sm" x="150" y="200">code + data</text>
    </g>
    <g transform="translate(233,0)">
      <rect x="90" y="120" width="120" height="90" rx="10" fill="#eef2f6" stroke="#3b5b7a" stroke-width="2"/>
      <rect x="108" y="140" width="34" height="44" rx="4" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <line x1="114" y1="152" x2="136" y2="152" stroke="#b9c4d0" stroke-width="2"/><line x1="114" y1="162" x2="136" y2="162" stroke="#b9c4d0" stroke-width="2"/><line x1="114" y1="172" x2="130" y2="172" stroke="#b9c4d0" stroke-width="2"/>
      <path d="M158 146 a16 6 0 0 0 32 0 v32 a16 6 0 0 1 -32 0 z" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <ellipse cx="174" cy="146" rx="16" ry="6" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <text class="sm" x="150" y="200">code + data</text>
    </g>
    <g transform="translate(466,0)">
      <rect x="90" y="120" width="120" height="90" rx="10" fill="#eef2f6" stroke="#3b5b7a" stroke-width="2"/>
      <rect x="108" y="140" width="34" height="44" rx="4" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <line x1="114" y1="152" x2="136" y2="152" stroke="#b9c4d0" stroke-width="2"/><line x1="114" y1="162" x2="136" y2="162" stroke="#b9c4d0" stroke-width="2"/><line x1="114" y1="172" x2="130" y2="172" stroke="#b9c4d0" stroke-width="2"/>
      <path d="M158 146 a16 6 0 0 0 32 0 v32 a16 6 0 0 1 -32 0 z" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <ellipse cx="174" cy="146" rx="16" ry="6" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <text class="sm" x="150" y="200">code + data</text>
    </g>
    <g transform="translate(699,0)">
      <rect x="90" y="120" width="120" height="90" rx="10" fill="#e9f4ec" stroke="#2f8f4e" stroke-width="2.5"/>
      <rect x="108" y="140" width="34" height="44" rx="4" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <line x1="114" y1="152" x2="136" y2="152" stroke="#b9c4d0" stroke-width="2"/><line x1="114" y1="162" x2="136" y2="162" stroke="#b9c4d0" stroke-width="2"/><line x1="114" y1="172" x2="130" y2="172" stroke="#b9c4d0" stroke-width="2"/>
      <path d="M158 146 a16 6 0 0 0 32 0 v32 a16 6 0 0 1 -32 0 z" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <ellipse cx="174" cy="146" rx="16" ry="6" fill="#fff" stroke="#8fa3b8" stroke-width="1.6"/>
      <text class="sm" x="150" y="200">now</text>
    </g>
  </g>

  <!-- history connectors -->
  <line x1="210" y1="165" x2="323" y2="165" stroke="#8a95a0" stroke-width="2.5" marker-end="url(#va)"/>
  <line x1="443" y1="165" x2="556" y2="165" stroke="#8a95a0" stroke-width="2.5" marker-end="url(#va)"/>
  <line x1="676" y1="165" x2="789" y2="165" stroke="#8a95a0" stroke-width="2.5" marker-end="url(#va)"/>

  <text x="500" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">one history for code and data</text>
  <text x="500" y="278" text-anchor="middle" font-size="15" fill="#55606b">git tracks code · git-annex tracks big data · DataLad unifies them</text>
</svg>
