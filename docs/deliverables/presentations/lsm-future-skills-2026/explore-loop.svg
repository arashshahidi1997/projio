<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a95a0"/>
    </marker>
    <marker id="er" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d63a2f"/>
    </marker>
  </defs>
  <style>
    .ptitle { font-size: 23px; font-weight: 700; text-anchor: middle; }
    .bx  { font-size: 16px; text-anchor: middle; fill: #1a1a1a; }
    .cap { font-size: 17px; text-anchor: middle; font-weight: 700; }
  </style>

  <!-- ============ BEFORE: turn-based ============ -->
  <rect x="20" y="36" width="452" height="466" rx="16" fill="#fdeceb" stroke="#e0483d" stroke-width="2.5"/>
  <text class="ptitle" x="246" y="70" fill="#d63a2f">before · turn-based</text>

  <rect x="146" y="92"  width="230" height="50" rx="10" fill="#fff" stroke="#e2a6a1" stroke-width="2"/>
  <text class="bx" x="261" y="123">you edit the prompt</text>
  <rect x="146" y="170" width="230" height="50" rx="10" fill="#fff" stroke="#e2a6a1" stroke-width="2"/>
  <text class="bx" x="261" y="201">agent rebuilds the notebook</text>
  <rect x="146" y="248" width="230" height="50" rx="10" fill="#fff" stroke="#e2a6a1" stroke-width="2"/>
  <text class="bx" x="261" y="279">rerun the whole notebook</text>
  <rect x="146" y="326" width="230" height="50" rx="10" fill="#fff" stroke="#e2a6a1" stroke-width="2"/>
  <text class="bx" x="261" y="357">you read one result</text>

  <line x1="261" y1="142" x2="261" y2="168" stroke="#d63a2f" stroke-width="2.5" marker-end="url(#er)"/>
  <line x1="261" y1="220" x2="261" y2="246" stroke="#d63a2f" stroke-width="2.5" marker-end="url(#er)"/>
  <line x1="261" y1="298" x2="261" y2="324" stroke="#d63a2f" stroke-width="2.5" marker-end="url(#er)"/>
  <!-- return loop on the left -->
  <path d="M146 351 C 70 351, 70 117, 146 117" fill="none" stroke="#d63a2f" stroke-width="2.5" marker-end="url(#er)"/>

  <!-- clock -->
  <circle cx="410" cy="273" r="16" fill="#fff" stroke="#d63a2f" stroke-width="2.5"/>
  <line x1="410" y1="273" x2="410" y2="264" stroke="#d63a2f" stroke-width="2.5"/>
  <line x1="410" y1="273" x2="417" y2="277" stroke="#d63a2f" stroke-width="2.5"/>

  <text class="cap" x="246" y="470" fill="#d63a2f">minutes per change</text>

  <!-- ============ NOW: pair on Marimo ============ -->
  <rect x="528" y="36" width="452" height="466" rx="16" fill="#d7f2ea" stroke="#0a9c82" stroke-width="2.5"/>
  <text class="ptitle" x="754" y="70" fill="#0a7a66">now · pair on Marimo</text>

  <!-- reactive notebook center -->
  <rect x="654" y="210" width="200" height="110" rx="12" fill="#fff" stroke="#0a9c82" stroke-width="2.5"/>
  <text class="bx" x="754" y="255" font-weight="700">Marimo notebook</text>
  <text class="bx" x="754" y="282" font-size="14" fill="#55606b">reactive · shared</text>

  <!-- you -->
  <rect x="556" y="238" width="86" height="54" rx="10" fill="#fff" stroke="#4fb89f" stroke-width="2"/>
  <text class="bx" x="599" y="271">you</text>
  <!-- agent -->
  <rect x="866" y="238" width="86" height="54" rx="10" fill="#fff" stroke="#4fb89f" stroke-width="2"/>
  <text class="bx" x="909" y="271">agent</text>

  <line x1="644" y1="265" x2="652" y2="265" stroke="#0a9c82" stroke-width="2.5" marker-start="url(#ea)" marker-end="url(#ea)"/>
  <line x1="856" y1="265" x2="864" y2="265" stroke="#0a9c82" stroke-width="2.5" marker-start="url(#ea)" marker-end="url(#ea)"/>

  <text class="bx" x="754" y="360" font-size="14" fill="#55606b">both edit at once; changes appear live</text>
  <text class="cap" x="754" y="470" fill="#0a7a66">seconds per change</text>
</svg>
