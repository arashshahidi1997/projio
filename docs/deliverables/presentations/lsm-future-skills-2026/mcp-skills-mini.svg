<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .h    { font-size: 20px; font-weight: 700; }
    .m    { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 18px; fill: #2f6fd0; font-weight: 700; }
    .s    { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
  </style>

  <text x="8" y="20" font-size="16" font-weight="700" fill="#55606b">the agent's handles</text>

  <!-- MCP tools -->
  <rect x="4" y="32" width="352" height="118" rx="12" fill="#eaf3fb" stroke="#3a86c8" stroke-width="2.5"/>
  <text class="h" x="18" y="58" fill="#2b6aa8">MCP tools</text>
  <text class="m" x="18" y="86">rag_query()</text>
  <text class="m" x="18" y="112">codio_get()</text>
  <text class="m" x="18" y="138">pipeio_run()</text>

  <!-- Skills -->
  <rect x="4" y="164" width="352" height="128" rx="12" fill="#fff3e6" stroke="#e8912e" stroke-width="2.5"/>
  <text class="h" x="18" y="190" fill="#c9741f">Skills</text>
  <text class="s" x="18" y="218">explore</text>
  <text class="s" x="18" y="246">promote</text>
  <text class="s" x="18" y="274">report</text>
</svg>
