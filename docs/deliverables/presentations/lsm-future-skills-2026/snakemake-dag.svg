<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a95a0"/>
    </marker>
  </defs>
  <style>
    .file { fill: #f4f6f8; stroke: #b8c0c8; stroke-width: 2; }
    .fn   { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #1a1a1a; }
    .rule { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #2bb996; font-weight: 700; }
    .edge { stroke: #8a95a0; stroke-width: 2; }
  </style>

  <!-- raw inputs (two datasets: wildcards generalize) -->
  <rect class="file" x="20"  y="24" width="200" height="46" rx="9"/>
  <text class="fn" x="120" y="52" text-anchor="middle">sub-01 …_ieeg.edf</text>
  <rect class="file" x="260" y="24" width="200" height="46" rx="9"/>
  <text class="fn" x="360" y="52" text-anchor="middle">sub-02 …_ieeg.edf</text>

  <line class="edge" x1="120" y1="70" x2="120" y2="132" marker-end="url(#a)"/>
  <line class="edge" x1="360" y1="70" x2="360" y2="132" marker-end="url(#a)"/>
  <text class="rule" x="240" y="106" text-anchor="middle">rule detect_bursts</text>

  <!-- per-dataset derivatives -->
  <rect class="file" x="20"  y="134" width="200" height="46" rx="9"/>
  <text class="fn" x="120" y="162" text-anchor="middle">sub-01 …_bursts.tsv</text>
  <rect class="file" x="260" y="134" width="200" height="46" rx="9"/>
  <text class="fn" x="360" y="162" text-anchor="middle">sub-02 …_bursts.tsv</text>

  <line class="edge" x1="120" y1="180" x2="230" y2="250" marker-end="url(#a)"/>
  <line class="edge" x1="360" y1="180" x2="250" y2="250" marker-end="url(#a)"/>
  <text class="rule" x="240" y="220" text-anchor="middle">rule summarize</text>

  <!-- aggregated -->
  <rect class="file" x="140" y="252" width="200" height="46" rx="9"/>
  <text class="fn" x="240" y="280" text-anchor="middle">summary.tsv</text>

  <line class="edge" x1="240" y1="298" x2="240" y2="360" marker-end="url(#a)"/>
  <text class="rule" x="240" y="334" text-anchor="middle">rule plot</text>

  <!-- final product -->
  <rect class="file" x="140" y="362" width="200" height="46" rx="9" fill="#f6d6f2" stroke="#c25bb0"/>
  <text class="fn" x="240" y="390" text-anchor="middle">figure.pdf</text>

  <text x="240" y="452" text-anchor="middle" font-size="15" fill="#7a7a7a">the DAG is inferred</text>
  <text x="240" y="476" text-anchor="middle" font-size="15" fill="#7a7a7a">from filenames.</text>
  <text x="240" y="500" text-anchor="middle" font-size="15" fill="#7a7a7a">change the raw file,</text>
  <text x="240" y="524" text-anchor="middle" font-size="15" fill="#7a7a7a">only its branch reruns.</text>
</svg>
